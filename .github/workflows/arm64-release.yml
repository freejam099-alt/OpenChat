name: Arm64 Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Liquid Glass Gradle plugin requires JVM 21 to run. The app bytecode still targets JVM 17
      # via app/build.gradle.kts (jvmTarget = 17).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install web UI dependencies
        working-directory: web-ui
        run: npm ci

      - name: Ensure Android SDK components and licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          set -o pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"
          fi
          if [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          fi

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare signing
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          cat > local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/app/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          else
            # Firebase is optional for this app. A syntactically valid placeholder satisfies
            # the Google Services plugin so release builds do not require a real project.
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "lastchat-local",
              "storage_bucket": "lastchat-local.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "lastchat.rikkafork.cocolal" }
                },
                "api_key": [ { "current_key": "AIzaSyDUMMY0000000000000000000000000000" } ],
                "services": { "crashlytics_service": {}, "remoteconfig_service": {} }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                  "android_client_info": { "package_name": "lastchat.rikkafork.cocolal.dev" }
                },
                "api_key": [ { "current_key": "AIzaSyDUMMY0000000000000000000000000001" } ],
                "services": { "crashlytics_service": {}, "remoteconfig_service": {} }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          ls -l app/release.jks app/google-services.json

      - name: Build release APKs (arm64 split included)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStableRelease --no-daemon -Plastchat.abi.splits=true

      - name: Report APK size and contents
        run: |
          APK=$(find app/build/outputs/apk -name '*arm64*release.apk' | head -1)
          ls -lh "$APK"
          unzip -l "$APK" | awk 'NR>3 && NF>=4 {n=$4; sub(/\/[^\/]*$/,"",n); split(n,a,"/"); k=a[1]; s[k]+=$1} END {for (k in s) printf "%10.2f MB  %s\n", s[k]/1048576, k}' | sort -rn | head -20
          unzip -l "$APK" | sort -rn | head -25

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LastChat-arm64-release
          path: app/build/outputs/apk/stable/release/*arm64*.apk
          if-no-files-found: error
          retention-days: 90
